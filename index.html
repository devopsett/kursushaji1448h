    // Bersihkan format tarikh dari sebarang format ISO
    function formatTarikhKemas(tarikhMentah) {
      if (!tarikhMentah) return "";
      const str = String(tarikhMentah).trim();
      
      if (str.includes("T")) {
        const bahagian = str.split("T")[0].split("-");
        if (bahagian.length === 3) {
          return `${bahagian[2]}/${bahagian[1]}/${bahagian[0]}`;
        }
      }

      if (str.includes("/")) {
        return str.split(" ")[0];
      }

      return str;
    }

    // Tukar DD/MM/YYYY ke YYYY-MM-DD
    function dmyToYmd(dmyStr) {
      if (!dmyStr || !dmyStr.includes("/")) return "";
      const p = dmyStr.split("/");
      return `${p[2]}-${p[1].padStart(2, '0')}-${p[0].padStart(2, '0')}`;
    }

    // Tukar YYYY-MM-DD ke DD/MM/YYYY
    function ymdToDmy(ymdStr) {
      if (!ymdStr || !ymdStr.includes("-")) return "";
      const p = ymdStr.split("-");
      return `${p[2]}/${p[1]}/${p[0]}`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderSenarai();
      if (APPS_SCRIPT_URL && !APPS_SCRIPT_URL.includes("XXXXXXXXXXXX")) {
        muatDataCloud();
      }
    });

    async function muatDataCloud() {
      const dot = document.getElementById('syncDot');
      const label = document.getElementById('syncLabel');
      const icon = document.getElementById('syncIcon');

      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("XXXXXXXXXXXX")) return;

      dot.className = "w-2 h-2 rounded-full bg-blue-400 animate-ping";
      label.textContent = "Menyegerak data...";
      icon.classList.add('fa-spin');

      try {
        const res = await fetch(`${APPS_SCRIPT_URL}?action=read`);
        const json = await res.json();
        if (json.success && Array.isArray(json.data)) {
          json.data.forEach(itemCloud => {
            const padan = senaraiMasjid.find(m => m.id === itemCloud.id);
            if (padan) {
              padan.selesai = Boolean(itemCloud.selesai);
              if (itemCloud.tarikhDipilih) {
                padan.tarikhDipilih = formatTarikhKemas(itemCloud.tarikhDipilih);
              }
              if (itemCloud.hari) {
                padan.hari = itemCloud.hari;
              }
            }
          });
          dot.className = "w-2 h-2 rounded-full bg-emerald-400";
          label.textContent = "Google Sheets: Tersambung";
          tunjukToast("Data kehadiran diselaraskan!");
        }
      } catch (err) {
        dot.className = "w-2 h-2 rounded-full bg-amber-400";
        label.textContent = "Mod Luar Talian";
      } finally {
        icon.classList.remove('fa-spin');
        renderSenarai();
      }
    }

      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("XXXXXXXXXXXX")) return;
      fetch(`${APPS_SCRIPT_URL}?${query}`).catch(err => console.warn(err));
    }

      tabSemasa = tab;

        if (t === tab) {
          el.className = "flex-1 sm:flex-initial px-3 py-1 rounded-md bg-brand-green text-white font-bold transition";
        } else {
          el.className = "flex-1 sm:flex-initial px-3 py-1 rounded-md text-slate-600 hover:bg-white transition";
        }
      });
      tapisSenarai();
    }

    function tapisSenarai() {

      const hasil = senaraiMasjid.filter(m => {
        const padanTab = 
          (tabSemasa === 'semua') ||
          (tabSemasa === 'belum' && !m.selesai) ||
          (tabSemasa === 'selesai' && m.selesai);

        const padanCari = m.nama.toLowerCase().includes(q) || m.daerah.toLowerCase().includes(q);
        return padanTab && padanCari;
      });

      renderSenarai(hasil);
    }

              </div>

              </h3>
              <p class="text-xs text-slate-600">

            </button>

              <i class="fa-brands fa-google"></i>
              <span>Google Maps</span>
            </a>
            <a href="${item.waze}" target="_blank" class="flex items-center justify-center gap-1.5 bg-sky-500 hover:bg-sky-600 text-white font-bold py-1.5 px-3 rounded-lg text-xs transition">
              <i class="fa-brands fa-waze"></i>
              <span>Waze</span>
            </a>
          </div>
        `;

        container.appendChild(kad);
      });

      kemaskiniTracker();
    }

    function toggleHadir(id) {
      const item = senaraiMasjid.find(m => m.id === id);
      if (!item) return;

      item.selesai = !item.selesai;
      hantarCloud(`action=toggle&id=${id}&status=${item.selesai}`);
      tapisSenarai();
      tunjukToast(item.selesai ? `Minggu ${item.minggu} selesai!` : `Minggu ${item.minggu} ditanda belum.`);
    }

    function kemaskiniTracker() {
      const jumlah = senaraiMasjid.length;
      const siap = senaraiMasjid.filter(m => m.selesai).length;
      const belum = jumlah - siap;
      const peratus = Math.round((siap / jumlah) * 100);

      document.getElementById('txtHadir').textContent = siap;
      document.getElementById('txtPeratus').textContent = `${peratus}%`;
      document.getElementById('barHadir').style.width = `${peratus}%`;
      document.getElementById('cntBelum').textContent = belum;
      document.getElementById('cntSelesai').textContent = siap;
    }

    // Modal Tukar Tarikh
    function bukaModalTarikh(id) {
      masjidTukar = senaraiMasjid.find(m => m.id === id);
      if (!masjidTukar) return;

      document.getElementById('namaMasjidModal').textContent = masjidTukar.nama;
      
      const tarikhSemasaBersih = formatTarikhKemas(masjidTukar.tarikhDipilih);
      const customInput = document.getElementById('inputCustomDate');
      const ymdValue = dmyToYmd(tarikhSemasaBersih);
      customInput.value = ymdValue;

      semakTarikhDipilih();

      document.getElementById('modalTarikh').classList.remove('hidden');
    }

    // Semak tarikh & sahkan tiada duplikasi dengan masjid lain
    function semakTarikhDipilih() {
      const val = document.getElementById('inputCustomDate').value;
      const previewText = document.getElementById('previewHariText');
      const errorBox = document.getElementById('errorDuplikasiText');
      const errorSpan = document.getElementById('errorMsgSpan');
      const btnSimpan = document.getElementById('btnSimpanTarikh');

      if (!val) {
        previewText.textContent = "";
        errorBox.classList.add('hidden');
        btnSimpan.disabled = true;
        return;
      }

      const dmyPilihan = ymdToDmy(val);
      const parts = val.split("-");
      const d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      const namaHari = NAMA_HARI[d.getDay()];

      previewText.textContent = `Hari: ${namaHari} (${dmyPilihan})`;

      // Semak adakah tarikh ini telah digunakan oleh masjid lain
      const masjidSama = senaraiMasjid.find(m => m.id !== masjidTukar.id && formatTarikhKemas(m.tarikhDipilih) === dmyPilihan);

      if (masjidSama) {
        errorSpan.textContent = `Tarikh ini telah diambil untuk Minggu ${masjidSama.minggu} (${masjidSama.nama}). Sila pilih tarikh lain.`;
        errorBox.classList.remove('hidden');
        btnSimpan.disabled = true; // Kunci butang simpan
      } else {
        errorBox.classList.add('hidden');
        btnSimpan.disabled = false; // Benarkan simpan
      }
    }

    function tutupModalTarikh() {
      document.getElementById('modalTarikh').classList.add('hidden');
      masjidTukar = null;
    }

    function simpanTarikh() {
      if (!masjidTukar) return;

      const ymdVal = document.getElementById('inputCustomDate').value;
      if (!ymdVal) return;

      const dmyBaru = ymdToDmy(ymdVal);

      // Semak sekali lagi sebelum simpan
      const masjidSama = senaraiMasjid.find(m => m.id !== masjidTukar.id && formatTarikhKemas(m.tarikhDipilih) === dmyBaru);
      if (masjidSama) {
        tunjukToast("Tarikh ini telah diambil oleh masjid lain!");
        return;
      }

      const parts = ymdVal.split("-");
      const d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      const hariBaru = NAMA_HARI[d.getDay()];

      masjidTukar.tarikhDipilih = dmyBaru;
      masjidTukar.hari = hariBaru;

      hantarCloud(`action=updateDate&id=${masjidTukar.id}&date=${encodeURIComponent(dmyBaru)}&day=${encodeURIComponent(hariBaru)}`);
      
      tutupModalTarikh();
      tapisSenarai();
      tunjukToast(`Tarikh ditukar: ${dmyBaru} (${hariBaru})`);
    }

    function tunjukToast(mesej) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = mesej;
      toast.classList.remove('translate-y-16', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-16', 'opacity-0');
      }, 2500);
    }
  </script>
</body>
</html>
